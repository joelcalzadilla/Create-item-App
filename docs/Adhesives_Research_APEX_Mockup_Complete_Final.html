.form-select:not(:disabled):hover {

}

.form-select:focus-visible {
  border-color: var(--ring);

}

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

}

.form-check:not(.form-switch)

  height: 100%;
  background: var(--primary-foreground);

  mask: var(--checkmark-image) center / 12px 12px no-repeat;

.form-check-input[type=&quot;radio&quot;] {

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;

.form-switch .form-check-input:disabled,

.form-range::-moz-range-track {

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],

    height: 44px;
  }

        &lt;/section&gt;

        &lt;section class=&quot;adre-view&quot; data-view=&quot;configuration&quot; hidden&gt;
          &lt;div class=&quot;adre-breadcrumb&quot;&gt;Configuration&lt;/div&gt;&lt;div class=&quot;adre-title-row&quot;&gt;&lt;div&gt;&lt;h1&gt;Application Configuration&lt;/h1&gt;&lt;p class=&quot;adre-subtitle&quot;&gt;Configuration-driven Item Types, attributes, and rules&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;adre-badge&quot;&gt;ADMIN&lt;/span&gt;&lt;/div&gt;
          &lt;!-- Production configuration sources: OPS.ADRE_INV_ITEM_TYPE, OPS.ADRE_INV_ITEM_SECTION, OPS.ADRE_INV_ITEM_ATTRIBUTE, OPS.ADRE_INV_ITEM_TYPE_ATTR, OPS.ADRE_INV_ITEM_TEMPLATE_RULE. --&gt;
          &lt;div class=&quot;adre-config-links&quot;&gt;&lt;div class=&quot;adre-config-link&quot; data-source=&quot;OPS.ADRE_INV_ITEM_TYPE&quot;&gt;&lt;h3&gt;Item Types&lt;/h3&gt;&lt;p&gt;Codes, descriptions, active status, and display order.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;adre-config-link&quot; data-sources=&quot;OPS.ADRE_INV_ITEM_SECTION OPS.ADRE_INV_ITEM_ATTRIBUTE&quot;&gt;&lt;h3&gt;Sections &amp; Attributes&lt;/h3&gt;&lt;p&gt;Reusable dynamic-form definitions and EBS mappings.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;adre-config-link&quot; data-source=&quot;OPS.ADRE_INV_ITEM_TYPE_ATTR&quot;&gt;&lt;h3&gt;Item Type Attribute Matrix&lt;/h3&gt;&lt;p&gt;Applicability, scope, requirements, defaults, and sequence.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;adre-config-link&quot; data-source=&quot;OPS.ADRE_INV_ITEM_TEMPLATE_RULE&quot;&gt;&lt;h3&gt;Template Rules&lt;/h3&gt;&lt;p&gt;Organization and business-dimension resolution with Test Rule.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;adre-region&quot; style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;adre-region-head&quot;&gt;&lt;h2&gt;Planner Rules&lt;/h2&gt;&lt;span class=&quot;adre-badge adre-ready&quot;&gt;DESIGN GAP&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;adre-region-body&quot;&gt;&lt;div class=&quot;adre-message adre-warning-message&quot;&gt;Persistence model for prefix/planner rules is pending final design. This mockup does not invent a production table.&lt;/div&gt;&lt;div class=&quot;adre-table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item Type Group&lt;/th&gt;&lt;th&gt;Prefix&lt;/th&gt;&lt;th&gt;Planner&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Adhesive Coatings&lt;/td&gt;&lt;td&gt;SP&lt;/td&gt;&lt;td&gt;14&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Slit Items&lt;/td&gt;&lt;td&gt;SP&lt;/td&gt;&lt;td&gt;14&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Adhesives / Liners / Converting&lt;/td&gt;&lt;td&gt;All&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Raw Material&lt;/td&gt;&lt;td&gt;TBD&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

      &lt;/main&gt;
    &lt;/div&gt;

    &lt;div class=&quot;adre-modal-backdrop&quot; id=&quot;adre-confirm-modal&quot; hidden&gt;
      &lt;div class=&quot;adre-modal&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;adre-modal-title&quot;&gt;
        &lt;div class=&quot;adre-modal-head&quot;&gt;&lt;h2 id=&quot;adre-modal-title&quot;&gt;Send to Oracle EBS&lt;/h2&gt;&lt;/div&gt;
        &lt;div class=&quot;adre-modal-body&quot;&gt;&lt;p&gt;Create item &lt;strong&gt;SP-94904-1032&lt;/strong&gt; in Oracle EBS?&lt;/p&gt;&lt;p class=&quot;adre-subtitle&quot; style=&quot;margin-top:8px&quot;&gt;This will call APPS.ADRE_CREATE_INV_ITEM.PCD_PROCESS_REQUEST after final validation.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;adre-modal-actions&quot;&gt;&lt;button class=&quot;adre-button&quot; id=&quot;adre-cancel-send&quot; type=&quot;button&quot;&gt;Cancel&lt;/button&gt;&lt;button class=&quot;adre-button adre-primary&quot; id=&quot;adre-confirm-send&quot; type=&quot;button&quot;&gt;Send to EBS&lt;/button&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;adre-apex-mockup&#x27;);
      const windowEl = root.querySelector(&#x27;.adre-window&#x27;);
      const modal = root.querySelector(&#x27;#adre-confirm-modal&#x27;);
      const productionConfigurationSources = Object.freeze({
        itemTypes: &#x27;OPS.ADRE_INV_ITEM_TYPE&#x27;,
        sections: &#x27;OPS.ADRE_INV_ITEM_SECTION&#x27;,
        attributes: &#x27;OPS.ADRE_INV_ITEM_ATTRIBUTE&#x27;,
        itemTypeAttributes: &#x27;OPS.ADRE_INV_ITEM_TYPE_ATTR&#x27;,
        templateRules: &#x27;OPS.ADRE_INV_ITEM_TEMPLATE_RULE&#x27;
      });
      const state = { density: &#x27;comfortable&#x27;, navigation: &#x27;expanded&#x27;, technicalDetails: false };

      const newFlow = root.querySelector(&#x27;#adre-new-request-flow&#x27;);
      const exampleFlow = root.querySelector(&#x27;#adre-example-request-flow&#x27;);
      function showNewRequest() {
        newFlow.hidden = false;
        exampleFlow.hidden = true;
        showView(&#x27;request&#x27;);
      }
      function showExistingRequest() {
        newFlow.hidden = true;
        exampleFlow.hidden = false;
        showView(&#x27;request&#x27;);
      }
      function showNewStep(step) {
        for (const name of [&#x27;general&#x27;, &#x27;org&#x27;, &#x27;documents&#x27;, &#x27;bom&#x27;, &#x27;review&#x27;]) {
          const panel = root.querySelector(&#x27;#adre-new-&#x27; + name + &#x27;-step&#x27;);
          const tab = root.querySelector(&#x27;#adre-new-&#x27; + name + &#x27;-tab&#x27;);
          const active = name === step;
          panel.hidden = !active;
          tab.classList.toggle(&#x27;is-active&#x27;, active);
          tab.setAttribute(&#x27;aria-selected&#x27;, String(active));
        }
        if (step === &#x27;review&#x27;) updateDraftReview();
      }
      function updateDraftReview() {
        root.querySelector(&#x27;#adre-new-review-item&#x27;).textContent = root.querySelector(&#x27;#adre-new-item-number&#x27;).value.trim() || &#x27;—&#x27;;
        const type = root.querySelector(&#x27;#adre-new-item-type&#x27;);
        root.querySelector(&#x27;#adre-new-review-type&#x27;).textContent = type.value ? type.selectedOptions[0].textContent : &#x27;—&#x27;;
        const names = [];
        if (!root.querySelector(&#x27;#adre-new-target-card&#x27;).hidden) names.push(&#x27;GRI&#x27;);
        if (!root.querySelector(&#x27;#adre-new-other-card&#x27;).hidden) names.push(&#x27;Another configured organization (illustration)&#x27;);
        root.querySelector(&#x27;#adre-new-review-orgs&#x27;).textContent = names.length ? names.join(&#x27;, &#x27;) : &#x27;None selected&#x27;;
      }

      function showView(name) {
        root.querySelectorAll(&#x27;.adre-view&#x27;).forEach((view) =&gt; { view.hidden = view.dataset.view !== name; });
        root.querySelectorAll(&#x27;.adre-nav-button&#x27;).forEach((button) =&gt; {
          button.classList.toggle(&#x27;is-active&#x27;, button.dataset.viewTarget === name);
        });
      }

      function renderOptions() {
        windowEl.classList.toggle(&#x27;adre-compact&#x27;, state.density === &#x27;compact&#x27;);
        windowEl.classList.toggle(&#x27;adre-collapsed&#x27;, state.navigation === &#x27;collapsed&#x27;);
        root.querySelectorAll(&#x27;.adre-technical&#x27;).forEach((node) =&gt; { node.hidden = !state.technicalDetails; });
      }

      root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const viewButton = event.target.closest(&#x27;[data-view-target]&#x27;);
        if (viewButton) {
          if (viewButton.dataset.viewTarget === &#x27;request&#x27; &amp;&amp; viewButton.textContent.includes(&#x27;Create&#x27;)) showNewRequest();
          else showView(viewButton.dataset.viewTarget);
        }

        const tab = event.target.closest(&#x27;[data-request-tab]&#x27;);
        if (tab) {
          root.querySelectorAll(&#x27;[data-request-tab]&#x27;).forEach((button) =&gt; {
            const active = button === tab;
            button.classList.toggle(&#x27;is-active&#x27;, active);
            button.setAttribute(&#x27;aria-selected&#x27;, String(active));
          });
          root.querySelectorAll(&#x27;[data-request-panel]&#x27;).forEach((panel) =&gt; { panel.hidden = panel.dataset.requestPanel !== tab.dataset.requestTab; });
        }

        if (event.target.closest(&#x27;[data-open-request]&#x27;)) showExistingRequest();
      });

      root.querySelector(&#x27;#adre-view-example&#x27;).addEventListener(&#x27;click&#x27;, showExistingRequest);
      for (const step of [&#x27;general&#x27;, &#x27;org&#x27;, &#x27;documents&#x27;, &#x27;bom&#x27;, &#x27;review&#x27;]) {
        root.querySelector(&#x27;#adre-new-&#x27; + step + &#x27;-tab&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showNewStep(step));
      }
      root.querySelector(&#x27;#adre-save-new-general&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const required = [&#x27;#adre-new-item-type&#x27;, &#x27;#adre-new-item-number&#x27;, &#x27;#adre-new-description&#x27;, &#x27;#adre-new-uom&#x27;];
        const missing = required.some((selector) =&gt; !root.querySelector(selector).value.trim());
        root.querySelector(&#x27;#adre-new-general-error&#x27;).hidden = !missing;
        if (missing) return;
        root.querySelector(&#x27;#adre-new-title&#x27;).textContent = &#x27;Draft: &#x27; + root.querySelector(&#x27;#adre-new-item-number&#x27;).value.trim();
        for (const step of [&#x27;org&#x27;, &#x27;documents&#x27;, &#x27;bom&#x27;, &#x27;review&#x27;]) root.querySelector(&#x27;#adre-new-&#x27; + step + &#x27;-tab&#x27;).disabled = false;
        showNewStep(&#x27;org&#x27;);
      });
      const newTargetChoice = root.querySelector(&#x27;#adre-new-target-choice&#x27;);
      const newOrgCards = {
        GRI: root.querySelector(&#x27;#adre-new-target-card&#x27;),
        OTHER: root.querySelector(&#x27;#adre-new-other-card&#x27;)
      };
      root.querySelector(&#x27;#adre-new-add-target&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const key = newTargetChoice.value;
        if (!key || !newOrgCards[key] || !newOrgCards[key].hidden) return;
        newOrgCards[key].hidden = false;
        newTargetChoice.querySelector(&#x27;option[value=&quot;&#x27; + key + &#x27;&quot;]&#x27;).disabled = true;
        newTargetChoice.value = &#x27;&#x27;;
        root.querySelector(&#x27;#adre-new-org-status&#x27;).hidden = true;
      });
      function removeNewOrg(key) {
        newOrgCards[key].hidden = true;
        newTargetChoice.querySelector(&#x27;option[value=&quot;&#x27; + key + &#x27;&quot;]&#x27;).disabled = false;
        root.querySelector(&#x27;#adre-new-org-status&#x27;).hidden = true;
      }
      root.querySelector(&#x27;#adre-new-remove-target&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; removeNewOrg(&#x27;GRI&#x27;));
      root.querySelector(&#x27;#adre-new-remove-other&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; removeNewOrg(&#x27;OTHER&#x27;));
      const updateTemplateHint = () =&gt; {
        const complete = root.querySelector(&#x27;#adre-new-division&#x27;).value &amp;&amp; root.querySelector(&#x27;#adre-new-business-unit&#x27;).value;
        root.querySelector(&#x27;#adre-new-template&#x27;).textContent = complete ? &#x27;Resolved from configured rule (example)&#x27; : &#x27;Awaiting MAS category selections&#x27;;
      };
      root.querySelector(&#x27;#adre-new-division&#x27;).addEventListener(&#x27;change&#x27;, updateTemplateHint);
      root.querySelector(&#x27;#adre-new-business-unit&#x27;).addEventListener(&#x27;change&#x27;, updateTemplateHint);
      root.querySelector(&#x27;#adre-new-save-org&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { root.querySelector(&#x27;#adre-new-org-status&#x27;).hidden = false; });

      const orgChoice = root.querySelector(&#x27;#adre-org-choice&#x27;);
      const selectedOrg = root.querySelector(&#x27;#adre-selected-org&#x27;);
      const noTarget = root.querySelector(&#x27;#adre-no-target&#x27;);
      const reviewTarget = root.querySelector(&#x27;#adre-review-target&#x27;);
      function renderSelectedOrganization() {
        const hasTarget = orgChoice.value === &#x27;GRI&#x27;;
        selectedOrg.hidden = !hasTarget;
        noTarget.hidden = hasTarget;
        reviewTarget.textContent = hasTarget ? &#x27;GRI / SPLICING ARCLAD GR&#x27; : &#x27;None selected&#x27;;
      }
      orgChoice.addEventListener(&#x27;change&#x27;, renderSelectedOrganization);
      root.querySelector(&#x27;#adre-remove-org&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        orgChoice.value = &#x27;&#x27;;
        renderSelectedOrganization();
      });
      renderSelectedOrganization();

      root.querySelector(&#x27;#adre-menu-toggle&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        state.navigation = windowEl.classList.contains(&#x27;adre-collapsed&#x27;) ? &#x27;expanded&#x27; : &#x27;collapsed&#x27;;
        renderOptions();
      });

      [root.querySelector(&#x27;#adre-send-request&#x27;), root.querySelector(&#x27;#adre-send-ready&#x27;)].forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; { modal.hidden = false; root.querySelector(&#x27;#adre-cancel-send&#x27;).focus(); });
      });
      root.querySelector(&#x27;#adre-cancel-send&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { modal.hidden = true; });
      root.querySelector(&#x27;#adre-confirm-send&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { modal.hidden = true; showView(&#x27;result&#x27;); });

      renderOptions();

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: windowEl, onChange: renderOptions });
        tweak.addSelect(state, &#x27;density&#x27;, { label: &#x27;Page density&#x27;, options: [{ label: &#x27;Comfortable&#x27;, value: &#x27;comfortable&#x27; }, { label: &#x27;Compact&#x27;, value: &#x27;compact&#x27; }], reference: &#x27;apex.density&#x27; });
        tweak.addSelect(state, &#x27;navigation&#x27;, { label: &#x27;Side navigation&#x27;, options: [{ label: &#x27;Expanded&#x27;, value: &#x27;expanded&#x27; }, { label: &#x27;Collapsed&#x27;, value: &#x27;collapsed&#x27; }], reference: &#x27;apex.navigation&#x27; });
        tweak.addToggle(state, &#x27;technicalDetails&#x27;, { label: &#x27;Show technical details&#x27;, reference: &#x27;support.technical-details&#x27; });
      }
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
